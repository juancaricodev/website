schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), TypeScript, CSS Modules
  Architecture: Migrating from vanilla static site to Next.js with
    React components. CSS Modules replacing BEM. Assets in public/.
  Testing: No test runner detected
  Style: CSS Modules, Manrope font

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected components/modules
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow conventional commits (feat:, fix:, chore:, docs:)
    - Follow conventional branches (feat/, fix/, chore/)
    - Load relevant project skills for the stack
    tdd: false
    test_command: ""
  verify:
    - Run build command to verify compilation
    - Compare implementation against every spec scenario
    test_command: ""
    build_command: "npm run build || next build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
